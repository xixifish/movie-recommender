    "numpy>=2.5.2",
    "onnxruntime>=1.30.0",
    "python-dotenv>=1.2.3",
    "requests>=2.34.2",
    "sentence-transformers>=6.0.0",
    "tokenizers>=0.22.2",
    "uvicorn[standard]>=0.52.4",
]
